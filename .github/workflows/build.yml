name: Build

# PRs are built on every platform before they merge, so main isn't built
# again. A v* tag builds and publishes the release.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v3.1.0

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-latest
            task: darwin:package ARCH=arm64
            artifact: relay-macos-arm64
          - name: Windows (amd64)
            os: windows-latest
            task: windows:package
            artifact: relay-windows-amd64
          - name: Linux (amd64)
            os: ubuntu-24.04
            task: linux:build
            artifact: relay-linux-amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Lint the frontend
        if: runner.os == 'Linux'
        run: npm ci && npm run lint
        working-directory: frontend

      - name: Build
        run: wails3 task ${{ matrix.task }}

      # After the build, which produces frontend/dist for the go:embed in main.go.
      # Skipped on Windows: the term and vault tests assume a Unix shell and file modes.
      - name: Test
        if: runner.os != 'Windows'
        run: go test ./...

      - name: Package (Linux .deb)
        if: runner.os == 'Linux'
        run: wails3 task linux:create:deb

      - name: Collect artifacts
        run: |
          mkdir -p dist
          case "${{ runner.os }}" in
            macOS)   ditto -c -k --keepParent bin/relay.app dist/relay-macos-arm64.zip ;;
            Windows) cp bin/relay.exe dist/ && cp bin/*installer*.exe dist/ ;;
            Linux)   tar -czf dist/relay-linux-amd64.tar.gz -C bin relay && cp bin/*.deb dist/ ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  # A v* tag becomes a published pre-release with every platform's build
  # attached. Running copies of Relay see it at their next update check.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          # Builds aren't code-signed, so a checksum list lets people check
          # a download is the file CI built.
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          cat > notes.md <<'NOTES'
          ## Opening Relay the first time

          These builds aren't code-signed, so your system asks before running them.

          **macOS (Apple silicon):** unzip, move `relay.app` to Applications and open it. When macOS says it can't check it for malware, click **Done**, then open **System Settings → Privacy & Security** and click **Open Anyway** next to Relay. Or run `xattr -dr com.apple.quarantine /Applications/relay.app`.

          **Windows:** run the installer (or the portable `relay.exe`). If SmartScreen says "Windows protected your PC", click **More info**, then **Run anyway**. No **Run anyway** button? Turn on **Settings → System → For developers → Developer Mode**, restart the PC, and run the installer again. Browser download warnings, Smart App Control and Defender are covered in the [Windows guide](https://github.com/shad0wcrawl3r/relay/blob/main/docs/windows-smartscreen.md).

          **Linux:** `sudo apt install ./relay.deb` on Debian or Ubuntu; elsewhere extract the `.tar.gz` (needs GTK 4 and WebKitGTK 6).

          **Check a download:** compare it with `SHA256SUMS`: `shasum -a 256 <file>` on macOS, `sha256sum <file>` on Linux, `Get-FileHash <file>` in PowerShell.
          NOTES
          gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --prerelease --verify-tag --generate-notes --notes-file notes.md --title "Relay $TAG"

      # A release made with the workflow token doesn't start other workflows,
      # so the status page is rebuilt by hand.
      - name: Rebuild the status page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml -R "$GITHUB_REPOSITORY" --ref main
