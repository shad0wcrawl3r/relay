name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v3.0.0

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            task: darwin:package:universal
            artifact: relay-macos-universal
          - name: Windows (amd64)
            os: windows-latest
            task: windows:package
            artifact: relay-windows-amd64
          - name: Linux (amd64)
            os: ubuntu-24.04
            task: linux:build
            artifact: relay-linux-amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Lint the frontend
        if: runner.os == 'Linux'
        run: npm ci && npm run lint
        working-directory: frontend

      - name: Build
        run: wails3 task ${{ matrix.task }}

      # After the build, which produces frontend/dist for the go:embed in main.go.
      # Skipped on Windows: the term and vault tests assume a Unix shell and file modes.
      - name: Test
        if: runner.os != 'Windows'
        run: go test ./...

      - name: Package (Linux .deb)
        if: runner.os == 'Linux'
        run: wails3 task linux:create:deb

      - name: Collect artifacts
        run: |
          mkdir -p dist
          case "${{ runner.os }}" in
            macOS)   ditto -c -k --keepParent bin/relay.app dist/relay-macos-universal.zip ;;
            Windows) cp bin/relay.exe dist/ && cp bin/*installer*.exe dist/ ;;
            Linux)   tar -czf dist/relay-linux-amd64.tar.gz -C bin relay && cp bin/*.deb dist/ ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
