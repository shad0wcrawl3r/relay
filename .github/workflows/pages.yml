name: Publish site

# relay.shadowcrawler.dev: the landing page, downloads, status and the Buffer
# sign-in callback. Deployed when a release goes out (pre-releases included),
# when the site changes on main, or by hand.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test the sign-in callback
        run: node --test site/test/*.test.js

      # The newest published release (pre-releases included; releases/latest
      # skips those), its files, and the Build run of its tag's commit.
      - name: Write status.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          release=$(gh api "repos/$REPO/releases?per_page=20" --jq 'map(select(.draft | not))[0] // {}')
          version=$(jq -r '.tag_name // ""' <<<"$release")
          run='{}'
          jobs='[]'
          if [ -n "$version" ]; then
            sha=$(gh api "repos/$REPO/commits/$version" --jq .sha)
            run=$(gh run list -R "$REPO" -w Build --commit "$sha" -L 20 --json databaseId,status,headSha,updatedAt,event \
              --jq 'map(select(.status == "completed" and .event == "push"))[0] // {}')
            id=$(jq -r '.databaseId // ""' <<<"$run")
            if [ -n "$id" ]; then
              jobs=$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq '.jobs')
            fi
          fi
          jq -n --argjson release "$release" --argjson run "$run" --argjson jobs "$jobs" '{
            version: ($release.tag_name // null),
            prerelease: ($release.prerelease // false),
            published_at: ($release.published_at // null),
            release_url: ($release.html_url // null),
            assets: [($release.assets // [])[] | {name, size, url: .browser_download_url}],
            updated_at: ($run.updatedAt // null),
            commit: (($run.headSha // "")[0:7] | if . == "" then null else . end),
            platforms: [$jobs[] | select(.conclusion != "skipped" and .name != "Draft release") | {name: (.name | split(" ")[0]), conclusion}]
          }' > site/public/status.json
          cat site/public/status.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

      - id: deployment
        uses: actions/deploy-pages@v5
