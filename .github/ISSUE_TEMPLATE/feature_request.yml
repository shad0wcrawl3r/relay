name: Feature request
description: An idea for Relay.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What you're trying to do, and what would make it easier.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Relay version
      description: Settings → About. Optional.
