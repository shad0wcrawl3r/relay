<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Relay terminal — prefix mode and session switcher</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
html,body{background:#09090b}
a{color:#e4e4e7}a:hover{color:#fafafa}
</style>
</helmet>
<div style="position: relative; width: 100%; min-height: 1000px; display: flex; flex-wrap: wrap; background: #09090b; color: #e4e4e7; font-family: 'Geist', system-ui, sans-serif; overflow: hidden;">

<div aria-hidden="true" style="flex: 0 0 56px; border-right: 1px solid #27272a; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0; box-sizing: border-box;">
<div style="width: 32px; height: 32px; border-radius: 8px; background: #fafafa; margin-bottom: 12px;"></div>
<div style="width: 44px; height: 44px; border-radius: 8px;"></div>
<div style="width: 44px; height: 44px; border-radius: 8px;"></div>
<div style="width: 44px; height: 44px; border-radius: 8px; background: #27272a;"></div>
</div>
<div aria-hidden="true" style="flex: 0 0 248px; border-right: 1px solid #27272a;"></div>
<div aria-hidden="true" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
<div style="height: 48px; border-bottom: 1px solid #27272a;"></div>
<div style="flex-grow: 1; display: flex; gap: 6px; padding: 0; background: #09090b;">
<div style="flex: 5; background: #0c0c0e; box-shadow: inset 0 0 0 1px #3f3f46;"></div>
<div style="flex: 4; display: flex; flex-direction: column; gap: 6px;"><div style="flex: 1; background: #0c0c0e;"></div><div style="flex: 1; background: #0c0c0e;"></div></div>
</div>
</div>

<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.62);"></div>

<div role="dialog" aria-modal="true" aria-label="Switch session" style="position: absolute; top: 120px; left: 50%; transform: translateX(-50%); width: min(640px, calc(100% - 32px)); border-radius: 12px; background: #111113; border: 1px solid #3f3f46; box-shadow: 0 24px 64px rgba(0,0,0,0.6); overflow: hidden;">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; height: 52px; border-bottom: 1px solid #27272a;">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input aria-label="Find a session" placeholder="Find a session, command or folder" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #fafafa; font-family: inherit; font-size: 15px;">
<span style="padding: 2px 8px; border-radius: 4px; background: #27272a; font-family: 'Geist Mono', monospace; font-size: 11px; color: #d4d4d8;">⌃B s</span>
</div>

<div style="padding: 6px; display: flex; flex-direction: column; gap: 2px; max-height: 420px; overflow-y: auto;">
<div style="padding: 8px 10px 4px; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #a1a1aa;">Background</div>
<sc-for list="{{bg}}" as="s" hint-placeholder-count="2">
<button onClick="{{s.pick}}" style="{{s.style}}">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; background: {{s.dot}};"></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
<span style="font-size: 14px; font-weight: 500; color: #fafafa;">{{s.name}}</span>
<span style="font-size: 12px; color: #a1a1aa; font-family: 'Geist Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.cmd}}</span>
</span>
<span style="font-size: 12px; color: #a1a1aa; font-family: 'Geist Mono', monospace;">{{s.meta}}</span>
</button>
</sc-for>
<div style="padding: 12px 10px 4px; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #a1a1aa;">In this tab</div>
<sc-for list="{{tab}}" as="s" hint-placeholder-count="1">
<button onClick="{{s.pick}}" style="{{s.style}}">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; background: {{s.dot}};"></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
<span style="font-size: 14px; font-weight: 500; color: #fafafa;">{{s.name}}</span>
<span style="font-size: 12px; color: #a1a1aa; font-family: 'Geist Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.cmd}}</span>
</span>
<span style="font-size: 12px; color: #a1a1aa; font-family: 'Geist Mono', monospace;">{{s.meta}}</span>
</button>
</sc-for>
</div>

<div style="padding: 12px 16px; border-top: 1px solid #27272a; background: #0c0c0e;">
<div style="font-size: 12px; color: #a1a1aa; margin-bottom: 10px;">Last lines from <span style="color: #fafafa; font-weight: 500;">{{picked.name}}</span></div>
<div style="font-family: 'Geist Mono', monospace; font-size: 12px; line-height: 18px; color: #d4d4d8; white-space: pre-wrap;">{{picked.tail}}</div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 16px; border-top: 1px solid #27272a; font-size: 12px; color: #a1a1aa;">
<span><kbd style="font-family: 'Geist Mono', monospace; color: #e4e4e7;">⏎</kbd> attach to pane</span>
<span><kbd style="font-family: 'Geist Mono', monospace; color: #e4e4e7;">⌥⏎</kbd> open in split</span>
<span><kbd style="font-family: 'Geist Mono', monospace; color: #e4e4e7;">⌘⏎</kbd> new tab</span>
<span style="flex-grow: 1;"></span>
<span><kbd style="font-family: 'Geist Mono', monospace; color: #e4e4e7;">⌃X</kbd> kill</span>
</div>
</div>

<div role="status" aria-label="Prefix mode" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(1040px, calc(100% - 32px)); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 6px; padding: 10px 12px; border-radius: 10px; background: #111113; border: 1px solid #3f3f46; box-shadow: 0 12px 32px rgba(0,0,0,0.5); font-size: 12px;">
<span style="height: 26px; padding: 0 10px; margin-right: 8px; display: inline-flex; align-items: center; border-radius: 6px; background: #fafafa; color: #09090b; font-weight: 600; letter-spacing: 0.04em;">⌃B</span>
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; height: 26px; border-radius: 6px; color: #a1a1aa;"><kbd style="font-family: 'Geist Mono', monospace; color: #fafafa;">%</kbd>split right</span>
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; height: 26px; border-radius: 6px; color: #a1a1aa;"><kbd style="font-family: 'Geist Mono', monospace; color: #fafafa;">"</kbd>split down</span>
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; height: 26px; border-radius: 6px; color: #a1a1aa;"><kbd style="font-family: 'Geist Mono', monospace; color: #fafafa;">←↑→↓</kbd>focus</span>
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; height: 26px; border-radius: 6px; color: #a1a1aa;"><kbd style="font-family: 'Geist Mono', monospace; color: #fafafa;">z</kbd>zoom</span>
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; height: 26px; border-radius: 6px; background: #27272a; color: #fafafa;"><kbd style="font-family: 'Geist Mono', monospace; color: #fafafa;">s</kbd>sessions</span>
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; height: 26px; border-radius: 6px; color: #a1a1aa;"><kbd style="font-family: 'Geist Mono', monospace; color: #fafafa;">d</kbd>send to background</span>
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; height: 26px; border-radius: 6px; color: #a1a1aa;"><kbd style="font-family: 'Geist Mono', monospace; color: #fafafa;">c</kbd>new tab</span>
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; height: 26px; border-radius: 6px; color: #a1a1aa;"><kbd style="font-family: 'Geist Mono', monospace; color: #fafafa;">x</kbd>close pane</span>
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; height: 26px; border-radius: 6px; color: #a1a1aa;"><kbd style="font-family: 'Geist Mono', monospace; color: #fafafa;">[</kbd>select mode</span>
<span style="flex-grow: 1;"></span>
<a href="Main.dc.html" style="height: 32px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; color: #a1a1aa; font-size: 12px; text-decoration: none;"><kbd style="font-family: 'Geist Mono', monospace; color: #e4e4e7;">esc</kbd>cancel</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: 'loki-tail' };
}
renderVals() {
const all = [
{ id: 'loki-tail', group: 'bg', name: 'loki-tail', cmd: 'logcli query --tail app=siem-ingest', meta: 'running · 2h 6m', dot: '#60a5fa',
tail: '09:27:51 level=info msg="batch flushed" events=412\n09:27:56 level=info msg="batch flushed" events=388\n09:28:01 level=warn msg="slow sink" sink=opensearch latency=1.8s' },
{ id: 'k0s-upgrade', group: 'bg', name: 'k0s-upgrade', cmd: 'k0sctl apply --config lab.yaml', meta: 'exit 0 · 35m ago', dot: '#4ade80',
tail: 'INFO ==> Running phase: Upgrade workers\nINFO ==> Finished in 6m14s\nINFO k0s cluster version v1.31.2+k0s.0 is now installed' },
{ id: 'scratch', group: 'bg', name: 'scratch', cmd: 'zsh · ~', meta: 'idle', dot: '#52525b',
tail: '$ df -h /\nFilesystem  Size  Used Avail Use% Mounted on\n/dev/nvme0  476G  212G  240G  47% /' },
{ id: 'relay', group: 'tab', name: 'relay', cmd: 'zsh · ~/dev/relay · last: go build ./cmd/relay', meta: 'exit 1', dot: '#f87171',
tail: '# relay/internal/term\ninternal/term/osc133.go:48:15: undefined: blockEnd' },
{ id: 'relay-dev', group: 'tab', name: 'relay-dev', cmd: 'wails3 dev', meta: 'running · 14m', dot: '#60a5fa',
tail: '09:21:40 INF HMR update sent\n09:27:58 WRN internal/term changed — rebuild failed, keeping last binary' },
{ id: 'cluster', group: 'tab', name: 'cluster', cmd: 'zsh · ~/infra/k0s · last: kubectl get pods -n siem', meta: 'idle', dot: '#52525b',
tail: 'siem-api-7b2c4       1/1    Running  0   6d\nopensearch-0         1/1    Running  0   11d\nloki-0               1/1    Running  2   11d' }
];
const self = this;
const decorate = (s) => Object.assign({}, s, {
pick: () => self.setState({ picked: s.id }),
style: 'display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; border-radius: 8px; font-family: inherit; text-align: left; cursor: pointer;' + (self.state.picked === s.id ? ' background: #27272a;' : ' background: transparent;')
});
const picked = all.find((s) => s.id === this.state.picked) || all[0];
return {
bg: all.filter((s) => s.group === 'bg').map(decorate),
tab: all.filter((s) => s.group === 'tab').map(decorate),
picked: picked
};
}
}
</script>
</body>
</html>
