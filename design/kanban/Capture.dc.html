<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick capture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#09090B}
a{color:#A1A1AA}a:hover{color:#FAFAFA}
.app *{box-sizing:border-box}
.app{position:relative;font-family:Inter,system-ui,sans-serif;font-size:13px;color:#E4E4E7;background:#09090B;display:flex;flex-wrap:wrap;width:100%;min-height:900px;overflow:hidden}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.side{flex:0 0 220px;background:#0C0C0E;border-right:1px solid #1F1F23;padding:14px 10px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px;font-weight:600;font-size:14px;color:#FAFAFA}
.logo{width:24px;height:24px;border-radius:6px;background:#FAFAFA;color:#09090B;display:grid;place-items:center;font-size:12px;font-weight:700}
.navgroup{display:flex;flex-direction:column;gap:2px}
.sect{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#8B8B94;padding:0 10px 6px}
.navitem{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 10px;border-radius:6px;color:#A1A1AA;text-decoration:none}
.navitem.on{background:#1A1A1E;color:#FAFAFA}
.badge{margin-left:auto;font-size:11px;color:#8B8B94}
.badge.pink{color:#FBCFE8;background:#4A1D35;padding:1px 7px;border-radius:999px}
.glyph{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:600;flex:0 0 20px}
.gw{background:#1E293B;color:#93C5FD}.gl{background:#2E1A47;color:#D8B4FE}.gh{background:#123534;color:#5EEAD4}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.top{min-height:56px;border-bottom:1px solid #1F1F23;display:flex;align-items:center;gap:10px;padding:10px 20px}
.crumb{display:flex;align-items:center;gap:10px}
.crumb h1{margin:0;font-size:15px;font-weight:600;color:#FAFAFA}
.dim{color:#8B8B94;font-size:11px}
.board{flex:1;display:flex;gap:12px;padding:16px 20px;align-items:flex-start;overflow:hidden}
.col{flex:0 0 264px;display:flex;flex-direction:column;gap:8px}
.colhead{display:flex;align-items:center;gap:8px;height:28px;padding:0 4px;font-size:12px;font-weight:500;color:#D4D4D8}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.count{color:#8B8B94;font-weight:400}
.colbody{display:flex;flex-direction:column;gap:8px;background:#0E0E10;border:1px solid #17171A;border-radius:10px;padding:8px}
.card{background:#16161A;border:1px solid #26262B;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.card .id{font-size:11px;color:#8B8B94}
.card .title{font-size:13px;line-height:1.4;color:#F4F4F5}
.scrim{position:absolute;inset:0;background:rgba(4,4,6,.62)}
.cmd{position:absolute;left:50%;top:120px;transform:translateX(-50%);width:min(640px,calc(100% - 32px));background:#111114;border:1px solid #2A2A30;border-radius:12px;box-shadow:0 30px 90px rgba(0,0,0,.65);overflow:hidden}
.inrow{display:flex;align-items:center;gap:12px;height:58px;padding:0 16px;border-bottom:1px solid #1F1F23;color:#A1A1AA}
.inrow input{flex:1;min-width:0;border:0;background:transparent;color:#FAFAFA;font:inherit;font-size:16px;outline:none}
kbd{font-family:'JetBrains Mono',monospace;font-size:10px;color:#A1A1AA;border:1px solid #2A2A2F;border-radius:4px;padding:1px 5px;background:#18181B}
.target{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid #1F1F23;font-size:12px;color:#8B8B94}
.tchip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px 0 5px;border:1px solid #2A2A30;border-radius:7px;background:transparent;color:#A1A1AA;font:inherit;font-size:12px;cursor:pointer}
.tchip .glyph{width:18px;height:18px;flex-basis:18px;font-size:10px}
.tchip.on{border-color:#A855F7;background:#1C1426;color:#F4F4F5}
.tchip .st{color:#8B8B94}
.tchip.on .st{color:#D8B4FE}
.toggle{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 4px;border:0;background:transparent;color:#A1A1AA;font:inherit;font-size:12px;cursor:pointer}
.sw{width:28px;height:16px;border-radius:999px;background:#27272A;position:relative;flex:0 0 28px}
.sw span{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#8B8B94}
.list{padding:8px;display:flex;flex-direction:column;gap:2px}
.grp{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#8B8B94;padding:8px 10px 4px}
.opt{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:#D4D4D8;font:inherit;font-size:13px;text-align:left;width:100%;cursor:pointer}
.opt:hover{background:#18181B}
.opt.act{background:#1C1C21;color:#FAFAFA}
.opt .ic{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:#18181B;color:#A1A1AA;flex:0 0 24px}
.opt.act .ic{background:#2E1A47;color:#D8B4FE}
.opt .k{margin-left:auto;display:flex;gap:4px}
.opt .sub{color:#8B8B94}
.foot{display:flex;align-items:center;flex-wrap:wrap;gap:16px;padding:10px 16px;border-top:1px solid #1F1F23;background:#0D0D10;font-size:11px;color:#8B8B94}
.foot span{display:inline-flex;align-items:center;gap:6px}
</style>
</helmet>
<div class="app">
<nav class="side" aria-label="Main">
<div class="brand"><span class="logo">R</span><span>Relay</span></div>
<div class="navgroup">
<a class="navitem" href="Attention.dc.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>Attention<span class="badge pink">8</span></a>
</div>
<div class="navgroup">
<div class="sect">Plane projects</div>
<a class="navitem on" href="Main.dc.html"><span class="glyph gw">W</span>Work<span class="badge">25</span></a>
<a class="navitem" href="Detail.dc.html"><span class="glyph gl">L</span>Lab<span class="badge">13</span></a>
<a class="navitem" href="#"><span class="glyph gh">T</span>Teaching</a>
</div>
</nav>
<main class="main" aria-hidden="true">
<header class="top"><div class="crumb"><span class="glyph gw">W</span><h1>Work</h1><span class="mono dim">WORK</span></div></header>
<div class="board">
<sc-for list="{{cols}}" as="col" hint-placeholder-count="5">
<section class="col">
<div class="colhead"><span class="dot" style="background: {{col.color}}"></span><span>{{col.name}}</span><span class="count">{{col.count}}</span></div>
<div class="colbody">
<sc-for list="{{col.items}}" as="c" hint-placeholder-count="2">
<article class="card"><span class="mono id">{{c.id}}</span><span class="title">{{c.title}}</span></article>
</sc-for>
</div>
</section>
</sc-for>
</div>
</main>
<div class="scrim" aria-hidden="true"></div>
<div class="cmd" role="dialog" aria-modal="true" aria-label="Quick capture">
<label class="inrow"><span class="sr">Capture an idea or run a command</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
<input type="text" value="Grafana panel for Plane cycle burndown">
<kbd>esc</kbd>
</label>
<div class="target">Create in
<button class="tchip on" aria-pressed="true"><span class="glyph gl">L</span>Lab <span class="st">· Idea</span></button>
<button class="tchip" aria-pressed="false"><span class="glyph gw">W</span>Work <span class="st">· Backlog</span></button>
<button class="tchip" aria-pressed="false"><span class="glyph gh">T</span>Teaching <span class="st">· Backlog</span></button>
<button class="toggle" role="switch" aria-checked="false"><span class="sw" aria-hidden="true"><span></span></span>Queue for agent</button>
</div>
<div class="list">
<button class="opt act"><span class="ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span><span>Create idea <span class="sub">in Lab → Idea</span></span><span class="k"><kbd>↵</kbd></span></button>
<div class="grp">Go to</div>
<sc-for list="{{cmds}}" as="o" hint-placeholder-count="5">
<button class="opt"><span class="ic"><span class="mono" style="font-size: 11px">{{o.ic}}</span></span><span>{{o.label}}</span><span class="k"><sc-for list="{{o.keys}}" as="k" hint-placeholder-count="1"><kbd>{{k}}</kbd></sc-for></span></button>
</sc-for>
</div>
<div class="foot"><span><kbd>↵</kbd>create</span><span><kbd>⌘↵</kbd>create &amp; open</span><span><kbd>⇥</kbd>cycle project</span><span><kbd>⌘K</kbd>open from anywhere</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const col = (name, color, items) => ({ name, color, count: items.length, items: items.map(([id, title]) => ({ id, title })) });
    return {
      cols: [
        col('Todo', '#60646C', [['WORK-18', 'Parser for FortiGate syslog (key=value)'], ['WORK-27', 'Prep notes for Thursday R&D sync'], ['WORK-25', 'On-prem upgrade checklist']]),
        col('Ready for Agent', '#3B82F6', [['WORK-19', 'Draft Sigma → LogQL translation spec'], ['WORK-22', 'Fuzz CEF parser with malformed headers']]),
        col('Agent Working', '#6366F1', [['WORK-15', 'Prototype Windows EVTX normalizer in Go']]),
        col('In Progress', '#F59E0B', [['WORK-12', 'ECS field mapping for firewall logs'], ['WORK-20', 'Retention policy for hot / warm tiers']]),
        col('Blocked', '#EF4444', [['WORK-16', 'Load-test ingest on staging cluster']])
      ],
      cmds: [
        { ic: '!', label: 'Attention', keys: ['G', 'A'] },
        { ic: 'W', label: 'Work board', keys: ['1'] },
        { ic: 'L', label: 'Lab board', keys: ['2'] },
        { ic: 'T', label: 'Teaching board', keys: ['3'] },
        { ic: 'E', label: 'Dev.to editor', keys: ['E'] },
        { ic: '↻', label: 'Sync now', keys: ['⌘', 'R'] }
      ]
    };
  }
}
</script>
</body>
</html>
